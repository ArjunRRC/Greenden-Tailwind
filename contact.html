<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenden</title>
    <!-- tailwind css cdn link -->
     <link href="./src/output.css" rel="stylesheet">
</head>
<body>
     <!-- Nav Bar -->

    <nav class="bg-green-100 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <h1 class="p-2 text-2xl">Greenden</h1> 

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 p-1 md:hidden">
  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
</svg>


        <ul class="p-2 gap-5 text-gray-600 hidden md:flex">
            <li>
                <a class="hover:underline hover:text-black" href="index.html">Home</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="products.html">Products</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="contact.html">Contact</a>
            </li>
        </ul>
    </nav>

    <!-- Contact form -->

    <section class="px-4 md:px-8 mt-6">
   <div class="max-w-xl mx-auto">
      <div class="mb-12">
         <h2 class="text-3xl font-bold text-slate-900 mb-6 md:text-4xl">
            Contact us
         </h2>
         <p class="text-base leading-relaxed text-slate-600">
            Have a question, need support? We're here to help.
         </p>
      </div>

      <form class="space-y-6">
         <div>
            <label for="name"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Name</label>
            <input type="text" id="name" name="name" placeholder="John doe"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="email"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Email</label>
            <input type="email" id="email" name="email" placeholder="john@readymadeui.com"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="phone" class="mb-2 text-slate-900 font-medium text-sm inline-block">Phone
               number</label>
            <input type="number" id="phone" name="phone" placeholder="+11800-259-854"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="message"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Message</label>
            <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600"></textarea>
         </div>

         <button type="submit"
            class="py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-black border bg-green-100 hover:bg-green-200 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-green-200">Send
            message</button>
      </form>
   </div>
</section>

     <!-- Footer -->
     <section class="mt-5 bg-green-100 p-10">
        <h1 class="text-2xl font-bold mt-5">Greenden</h1>
        <p class="mt-5">Bringing nature-inspired beauty to your space with premium artificial plants.</p>
        <p class="mt-5">@ 2026 Greenden.com</p>
     </section>
</body>
</html>
